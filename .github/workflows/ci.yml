name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_ROOT_PASSWORD: sextant-ci
        ports:
          - 8529:8529
    env:
      DATABASE_URL: http://127.0.0.1:8529
      DATABASE_NAME: sextant_ci
      ARANGODB_USER: root
      ARANGODB_PASSWORD: sextant-ci
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Wait for ArangoDB
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 2
          --retry-connrefused --user "$ARANGODB_USER:$ARANGODB_PASSWORD"
          "$DATABASE_URL/_db/_system/_api/version" --output /dev/null
      - run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
